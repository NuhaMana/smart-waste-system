<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="10">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Smart Waste Map</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet/dist/leaflet.css"
    />

    <style>

        body {
            margin: 0;
            padding: 0;
        }

        #map {
            height: 100vh;
            width: 100%;
        }

    </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

    var map = L.map('map').setView([6.905, 79.865], 14);

    L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            attribution: '&copy; OpenStreetMap contributors'
        }
    ).addTo(map);

    var bins = {{ bins|safe }};
    var route = {{ route|safe }};
// BIN MARKERS

bins.forEach(function(bin) {

    var markerColor = "green";

    if (bin.fill >= 80) {
        markerColor = "red";
    }
    else if (bin.fill >= 50) {
        markerColor = "orange";
    }

    var icon = L.icon({

        iconUrl:
            "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-" +
            markerColor +
            ".png",

        shadowUrl:
            "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/images/marker-shadow.png",

        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34],
        shadowSize: [41, 41]

    });

    L.marker(
        [bin.lat, bin.lon],
        { icon: icon }
    )
    .addTo(map)
    .bindPopup(
        bin.id + " - " + bin.fill + "%"
    );

});
    
    // ROUTE LINE
    if (route.length >= 2) {

    var polyline = L.polyline(
    route,
    {
        color: '#0066ff',
        weight: 6,
        opacity: 1
    }
    ).addTo(map);

map.fitBounds(polyline.getBounds());

        // TRUCK ICON
       var truckIcon = L.icon({
        iconUrl: 'https://cdn-icons-png.flaticon.com/512/744/744465.png',
        iconSize: [45, 45]
       });

        var truck = L.marker(
            route[0],
            { icon: truckIcon }
        ).addTo(map);

        var currentSegment = 0;
var progress = 0;

function animateTruck() {

    if (route.length < 2) {
        return;
    }

    var start = route[currentSegment];
    var end = route[currentSegment + 1];

    var lat =
        start[0] + (end[0] - start[0]) * progress;

    var lng =
        start[1] + (end[1] - start[1]) * progress;

    truck.setLatLng([lat, lng]);

    progress += 0.01;

    if (progress >= 1) {

        progress = 0;

        currentSegment++;

        if (currentSegment >= route.length - 1) {
            currentSegment = 0;
        }
    }

    requestAnimationFrame(animateTruck);
}

animateTruck();

    }

</script>

</body>
</html>
